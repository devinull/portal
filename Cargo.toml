[workspace]
members = ["portal-core", "portal-cli", "portal-tui"]
resolver = "2"

[workspace.package]
edition = "2024"
license = "MIT"
version = "0.0.1"

[workspace.dependencies]
clap = { version = "4", features = ["derive"] }
directories = "6"
ratatui = { version = "0.30", default-features = false, features = ["crossterm"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "2"
toml = "1.1"
